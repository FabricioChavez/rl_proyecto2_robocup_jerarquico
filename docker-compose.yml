x-runtime: &runtime
  image: robocup-p2:cpu
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  init: true
  shm_size: 1gb
  environment:
    ROBOCUP_DEVICE: cpu
  volumes:
    - ./runs:/workspace/runs
    - ./subtareas:/workspace/subtareas
    - ./global:/workspace/global
    - ./informe:/workspace/informe
    - ./escenarios:/workspace/escenarios:ro

services:
  visual:
    <<: *runtime
    ports:
      - "127.0.0.1:6080:6080"
    entrypoint: ["bash", "/opt/robocup/start_visual.sh"]
    command: []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/vnc.html', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
  entrenamiento:
    <<: *runtime
    profiles: ["training"]
    command: ["python", "-u", "-m", "robocup_rl.campana", "--steps", "10000", "--seeds", "0", "1", "2", "--evaluate", "200"]
