x-runtime: &runtime
  image: robocup-p2:cpu
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  init: true
  shm_size: 1gb
  environment:
    ROBOCUP_DEVICE: cpu
  volumes:
    - ./resultados:/workspace/resultados
    - ./informe:/workspace/informe
    - ./datos:/workspace/datos

services:
  visual:
    <<: *runtime
    ports:
      - "127.0.0.1:6080:6080"
    entrypoint: ["bash", "/opt/robocup/start_visual.sh"]
    command: []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6080/vnc.html', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
  proyecto:
    <<: *runtime
    entrypoint: ["python", "proyecto.py"]
    command: ["estado"]
