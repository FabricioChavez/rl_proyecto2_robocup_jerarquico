[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-robocup-jerarquico"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "gymnasium>=1.0,<1.3", "torch>=2.3", "matplotlib>=3.8", "pandas>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "rutas", "experimentos_conduccion"]

[tool.setuptools.packages.find]
where = ["src"]
