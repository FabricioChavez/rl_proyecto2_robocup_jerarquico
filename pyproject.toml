[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-robocup-jerarquico"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "gymnasium>=1.0,<1.3", "stable-baselines3==2.7.1", "torch>=2.3", "matplotlib>=3.8", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
